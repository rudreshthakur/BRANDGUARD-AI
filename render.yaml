# Render Blueprint: one web service (API + built frontend) and a managed PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: brandguard-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-db
          property: connectionString
      - key: BRANDGUARD_LLM_PROVIDER
        value: none            # set to "anthropic" or "openai" to enable AI contextual analysis
      - key: BRANDGUARD_LLM_API_KEY
        sync: false            # enter in the Render dashboard; never commit
      - key: BRANDGUARD_LLM_MODEL
        sync: false
      - key: BRANDGUARD_SANDBOX_TTL_HOURS
        value: "72"
databases:
  - name: brandguard-db
    plan: free
